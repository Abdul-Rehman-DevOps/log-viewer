<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Log Viewer — Sign in</title>
<link rel="icon" href="/assets/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root,[data-theme=dark]{--bg:#0f1419;--panel:#151b23;--border:#2a3441;--text:#d1d5db;--muted:#6b7280;--accent:#14b8a6;--accent-text:#042f2e;--err:#f87171}
[data-theme=light]{--bg:#f1f5f9;--panel:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#0f766e;--accent-text:#f0fdfa;--err:#dc2626}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--text);background:var(--bg)}
.card{width:min(400px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1.5rem;position:relative}
.theme{position:absolute;top:.75rem;right:.75rem;width:30px;height:30px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;padding:0;cursor:pointer;font-size:1rem}
.brand{display:flex;gap:.75rem;align-items:center;margin-bottom:1.1rem}
.brand img{width:44px;height:44px;border-radius:8px}.brand strong{font-size:1.25rem;font-weight:600}
label{font-size:.9rem;color:var(--muted)}
input{width:100%;margin:.35rem 0 .85rem;padding:.7rem .8rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
button.go{width:100%;border:0;border-radius:6px;padding:.75rem;font-weight:600;background:var(--accent);color:var(--accent-text);cursor:pointer}
.err{color:var(--err);min-height:1.2rem;font-size:.9rem;margin-top:.55rem}
</style></head>
<body>
<div class="card">
  <button class="theme" id="themeBtn" type="button" title="Toggle theme">☀</button>
  <div class="brand"><img src="/assets/logo.png" alt=""/><strong>Log Viewer</strong></div>
  <label>Username</label><input id="u" autocomplete="username"/>
  <label>Password</label><input id="p" type="password" autocomplete="current-password"/>
  <button class="go" id="go">Sign in</button>
  <div class="err" id="err"></div>
</div>
<script>
function normalizeTheme(t){return (t==="light"||t==="nord-light"||t==="solarized-light")?"light":"dark";}
function applyTheme(theme){
  theme=normalizeTheme(theme);
  document.documentElement.setAttribute("data-theme",theme);
  localStorage.setItem("lv_theme",theme);
  const btn=document.getElementById("themeBtn");
  btn.textContent=theme==="dark"?"☀":"☾";
  btn.title=theme==="dark"?"Switch to light":"Switch to dark";
}
applyTheme(localStorage.getItem("lv_theme")||"dark");
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark"?"light":"dark");
};
(function(){
  const err=document.getElementById("err");
  const q=new URLSearchParams(location.search);
  const reason=q.get("reason")||(sessionStorage.getItem("lv_timeout")==="1"?"timeout":sessionStorage.getItem("lv_restart")==="1"?"restart":"");
  if(reason==="timeout") err.textContent="Session timed out due to inactivity. Please sign in again.";
  else if(reason==="restart") err.textContent="Session ended because Log Viewer restarted. Please sign in again.";
  sessionStorage.removeItem("lv_timeout");
  sessionStorage.removeItem("lv_restart");
})();
document.getElementById("go").onclick=async()=>{
  const err=document.getElementById("err"); err.textContent="";
  const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});
  if(res.status===403){location.href="/setup";return;}
  if(!res.ok){err.textContent="Invalid username or password";return;}
  location.href="/";
};
document.getElementById("p").addEventListener("keydown",(e)=>{if(e.key==="Enter")document.getElementById("go").click();});
</script>
</body></html>
