<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Log Viewer — Setup</title>
<link rel="icon" href="/assets/logo.png"/>
<style>
:root,[data-theme=dark]{--bg:#0b0f14;--panel:#151c24;--border:#2a3542;--text:#e8eef6;--muted:#8b9bb0;--accent:#2dd4a8;--accent-text:#062018}
[data-theme=light]{--bg:#eef2f6;--panel:#fff;--border:#d5dde6;--text:#1a2330;--muted:#5b6b7c;--accent:#0f9f7a;--accent-text:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}
.card{width:min(460px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:1.6rem}
.brand{display:flex;gap:.75rem;align-items:center;margin-bottom:1rem}
.brand img{width:44px;height:44px;border-radius:10px}
h1{margin:0;font-size:1.25rem}p{color:var(--muted);line-height:1.5}
a{display:inline-block;margin-top:.75rem;padding:.7rem 1rem;border-radius:8px;background:var(--accent);color:var(--accent-text);text-decoration:none;font-weight:700}
</style></head>
<body>
<div class="card">
  <div class="brand"><img src="/assets/logo.png" alt=""/><h1>Log Viewer</h1></div>
  <p>No viewer users exist yet. Open the Admin panel, create at least one user, then sign in here to view logs.</p>
  <a href="/admin">Open Admin panel</a>
</div>
</body></html>
