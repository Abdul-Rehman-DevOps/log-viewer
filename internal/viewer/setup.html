<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Log Viewer — Setup</title>
<link rel="icon" href="/assets/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root,[data-theme=dark]{--bg:#0f1419;--panel:#151b23;--border:#2a3441;--text:#d1d5db;--muted:#6b7280;--accent:#14b8a6;--accent-text:#042f2e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--text);background:var(--bg)}
.card{width:min(460px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1.6rem}
.brand{display:flex;gap:.75rem;align-items:center;margin-bottom:1rem}
.brand img{width:44px;height:44px;border-radius:8px}
h1{margin:0;font-size:1.25rem;font-weight:600}p{color:var(--muted);line-height:1.5}
a{display:inline-block;margin-top:.75rem;padding:.7rem 1rem;border-radius:6px;background:var(--accent);color:var(--accent-text);text-decoration:none;font-weight:600}
</style></head>
<body>
<div class="card">
  <div class="brand"><img src="/assets/logo.png" alt=""/><h1>Log Viewer</h1></div>
  <p>No viewer users exist yet. Open the Admin panel, create at least one user, then sign in here to view logs.</p>
  <a href="/admin">Open Admin panel</a>
</div>
</body></html>
